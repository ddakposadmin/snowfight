name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','capacitor.config.json','package.json','.github/workflows/apk.yml','mkicons.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: mkdir -p www && cp index.html manifest.json icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - name: Add deep link intent filter
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          f='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="kr.ddakal.snowfight" android:host="login"/></intent-filter>'
          assert '</activity>' in s
          s=s.replace('</activity>',f+'</activity>',1)
          open(p,'w').write(s)
          PY
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/ci-keystore/snowfight.keystore
          key: snowfight-keystore-v2
      - name: Create signing key if missing
        run: |
          mkdir -p ~/ci-keystore
          if [ ! -f ~/ci-keystore/snowfight.keystore ]; then
            keytool -genkeypair -keystore ~/ci-keystore/snowfight.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Snowfight, O=DDAGAL SOLUTION, C=KR"
            echo "NEW KEY"
          else echo "CACHED KEY"; fi
          keytool -list -keystore ~/ci-keystore/snowfight.keystore -storepass android | tail -2
      - name: Icons and version
        run: |
          pip install pillow
          python3 mkicons.py android/app/src/main/res
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          python3 - <<'PY'
          import os
          p='android/app/build.gradle'
          t=open(p).read()
          k=os.path.expanduser('~/ci-keystore/snowfight.keystore')
          blk="android {\n    signingConfigs {\n        debug {\n            storeFile file('"+k+"')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n"
          t=t.replace("android {\n",blk,1)
          open(p,'w').write(t)
          PY
          grep -n "versionCode\|storeFile" android/app/build.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk snowfight.apk
      - uses: actions/upload-artifact@v4
        with: { name: snowfight-apk, path: snowfight.apk }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest snowfight.apk --title "latest" --notes "auto build"
