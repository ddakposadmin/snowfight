name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','capacitor.config.json','package.json','.github/workflows/apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: mkdir -p www && cp index.html manifest.json icon-192.png icon-512.png www/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk snowfight.apk
      - uses: actions/upload-artifact@v4
        with: { name: snowfight-apk, path: snowfight.apk }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest snowfight.apk --title "latest" --notes "auto build"
